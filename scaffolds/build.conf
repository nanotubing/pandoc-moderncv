# build.conf - personal build settings for Pandoc-MarkdownResume
#
# build.sh sources this file (as bash) when it exists at cv/build.conf. It
# lives in cv/ with the rest of your resume content, so keep anything personal
# (your name, hosts, paths) here rather than in build.sh.

# Base name for the named PDF copies made by `./build.sh build`:
#   dist/<RESUME_NAME>.pdf        public variant
#   dist/<RESUME_NAME>_full.pdf   private variant
RESUME_NAME=John_Doe

# Browser used to render the PDF. Uncomment to change it from the default:
#   chrome   - system-installed Google Chrome (default; no download needed)
#   bundled  - Chromium managed by Puppeteer, for machines without Chrome;
#              install it once with `npm run install-browser`
#   <path>   - an explicit browser executable path
# PDF_BROWSER=bundled

# `./build.sh deploy` runs this function. It can run any commands - cp, scp,
# rsync, a custom script - from the repository root. Run `./build.sh build`
# first; the files worth publishing are:
#   $DIST_DIR/cv_public.pdf   $DIST_DIR/cv_public.html
#   $DIST_DIR/fonts/  $DIST_DIR/images/  $DIST_DIR/stylesheets/  (used by the HTML)
# $RESUME_NAME is also available. Uncomment and adapt one of the examples:
#
# deploy() {
#     # Copy to a local directory (e.g. a static site checkout)
#     local dest="$HOME/src/example.com/resume"
#     mkdir -p "$dest"
#     cp "$DIST_DIR/cv_public.pdf"  "$dest/$RESUME_NAME.pdf"
#     cp "$DIST_DIR/cv_public.html" "$dest/index.html"
#     rsync -rupE "$DIST_DIR/fonts" "$DIST_DIR/images" "$DIST_DIR/stylesheets" "$dest"
#
#     # ...or upload to a server
#     # scp -r "$DIST_DIR"/cv_public.* "$DIST_DIR"/{fonts,images,stylesheets} user@example.com:/var/www/resume/
#
#     # ...or hand off to your own script
#     # ./my-deploy.sh "$DIST_DIR"
# }
